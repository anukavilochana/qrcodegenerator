<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a, lch(16.39% 13.07 274.7));
    color: var(--text);
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0;
    margin-bottom: 24px;
  }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-bottom: 8px;
  }
  button:hover { opacity: 0.85; }
  button.secondary {
    background: transparent;
    border: 1px solid #334155;
    color: var(--text);
  }
  #qrcode {
    margin: 20px auto 10px;
    display: flex;
    justify-content: center;
    background: white;
    padding: 16px;
    border-radius: 12px;
    width: fit-content;
    min-height: 20px;
  }
  #qrcode img, #qrcode canvas {
    display: block;
  }
  .hint {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 4px;
  }
   footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid #334155;
    text-align: center;
  }
  footer p {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0 0 12px;
  }
  .social-icons {
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .social-icons a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid #334155;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .social-icons a:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f172a;
    transform: translateY(-2px);
  }
  .social-icons svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

<script>
  const textInput = document.getElementById('textInput');
  const sizeSelect = document.getElementById('sizeSelect');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const qrcodeDiv = document.getElementById('qrcode');
  const statusText = document.getElementById('statusText');

  let qr = null;

  function generate() {
    const text = textInput.value.trim();
    if (!text) {
      statusText.textContent = 'URL එකක් type කරන්න.';
      return;
    }
    qrcodeDiv.innerHTML = '';
    const size = parseInt(sizeSelect.value, 10);

    qr = new QRCode(qrcodeDiv, {
      text: text,
      width: size,
      height: size,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    statusText.textContent = 'QR Code Generated.Click "Download PNG" To Save.';
    downloadBtn.style.display = 'block';
  }

  function download() {
    setTimeout(() => {
      const img = qrcodeDiv.querySelector('img');
      const canvas = qrcodeDiv.querySelector('canvas');
      const src = img ? img.src : (canvas ? canvas.toDataURL("image/png") : null);
      if (!src) return;
      const link = document.createElement('a');
      link.href = src;
      link.download = 'qrcode.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }, 100);
  }

  generateBtn.addEventListener('click', generate);
  downloadBtn.addEventListener('click', download);
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') generate();
  });
</script>
